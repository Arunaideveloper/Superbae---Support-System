<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1040" viewBox="0 0 1480 1040" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1480" height="1040" fill="#f8fafc"/>

  <!-- Title -->
  <text x="60" y="58" font-size="34" font-weight="700" fill="#0f172a">Superbae Support System</text>
  <text x="60" y="90" font-size="19" fill="#64748b">Architecture &amp; request flow — three runtimes, one database</text>
  <line x1="60" y1="108" x2="1420" y2="108" stroke="#e2e8f0" stroke-width="2"/>

  <!-- ===================== CLIENT ===================== -->
  <g filter="url(#shadow)">
    <rect x="60" y="140" width="1360" height="96" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  </g>
  <text x="84" y="172" font-size="13" font-weight="700" letter-spacing="1.5" fill="#94a3b8">CLIENT</text>
  <g>
    <rect x="84" y="182" width="280" height="42" rx="9" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="224" y="208" font-size="15" font-weight="600" fill="#1e3a8a" text-anchor="middle">Customer — Help Center &amp; Tickets</text>
  </g>
  <g>
    <rect x="384" y="182" width="240" height="42" rx="9" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="504" y="208" font-size="15" font-weight="600" fill="#1e3a8a" text-anchor="middle">Agent — Workspace</text>
  </g>
  <g>
    <rect x="644" y="182" width="240" height="42" rx="9" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="764" y="208" font-size="15" font-weight="600" fill="#1e3a8a" text-anchor="middle">Admin — Dashboard</text>
  </g>
  <g>
    <rect x="1030" y="182" width="366" height="42" rx="9" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="1213" y="208" font-size="14.5" font-weight="600" fill="#334155" text-anchor="middle">Ara chat widget (embedded everywhere)</text>
  </g>

  <!-- arrow client -> frontend -->
  <line x1="490" y1="236" x2="490" y2="280" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="504" y="264" font-size="13" fill="#475569">HTTPS (browser)</text>

  <!-- ===================== FRONTEND ===================== -->
  <g filter="url(#shadow)">
    <rect x="60" y="282" width="1360" height="118" rx="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  </g>
  <text x="84" y="314" font-size="13" font-weight="700" letter-spacing="1.5" fill="#6366f1">FRONTEND · frontend/</text>
  <text x="84" y="344" font-size="19" font-weight="700" fill="#0f172a">Next.js 16 (App Router) + React 19 · TypeScript</text>
  <text x="84" y="372" font-size="14.5" fill="#475569">Tailwind CSS v4 · shadcn/ui + Radix · lucide-react · react-markdown</text>
  <rect x="1030" y="322" width="366" height="58" rx="9" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="1213" y="346" font-size="13.5" font-weight="600" fill="#3730a3" text-anchor="middle">Next /api rewrite proxy</text>
  <text x="1213" y="366" font-size="12.5" fill="#6366f1" text-anchor="middle">same-origin → no CORS in dev</text>

  <!-- arrow frontend -> api -->
  <line x1="490" y1="400" x2="490" y2="448" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="504" y="430" font-size="13" fill="#2563eb">/api/*  ·  Bearer JWT</text>

  <!-- ===================== API ===================== -->
  <g filter="url(#shadow)">
    <rect x="60" y="450" width="1360" height="168" rx="14" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
  </g>
  <text x="84" y="482" font-size="13" font-weight="700" letter-spacing="1.5" fill="#059669">API · server/  (canonical)</text>
  <text x="84" y="512" font-size="19" font-weight="700" fill="#0f172a">Node.js + Express 4 · TypeScript · Mongoose</text>

  <!-- module chips -->
  <g font-size="13.5" font-weight="600">
    <rect x="84"  y="532" width="120" height="34" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/><text x="144" y="554" fill="#065f46" text-anchor="middle">Auth · JWT</text>
    <rect x="214" y="532" width="150" height="34" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/><text x="289" y="554" fill="#065f46" text-anchor="middle">Tickets + SLA</text>
    <rect x="374" y="532" width="170" height="34" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/><text x="459" y="554" fill="#065f46" text-anchor="middle">Knowledge Base</text>
    <rect x="554" y="532" width="110" height="34" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/><text x="609" y="554" fill="#065f46" text-anchor="middle">Teams</text>
    <rect x="674" y="532" width="110" height="34" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/><text x="729" y="554" fill="#065f46" text-anchor="middle">Users</text>
    <rect x="794" y="532" width="150" height="34" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/><text x="869" y="554" fill="#065f46" text-anchor="middle">Assistant (Ara)</text>
  </g>
  <text x="84" y="596" font-size="14" fill="#475569">Hardening: Zod validation · helmet · rate-limit · bcrypt · audit events on every ticket change</text>

  <!-- arrow api -> mongo -->
  <line x1="300" y1="618" x2="300" y2="690" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="314" y="662" font-size="13" fill="#475569">Mongoose (read / write)</text>

  <!-- arrow api -> ai (to the right) -->
  <path d="M 945 552 H 1120 V 690" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="960" y="542" font-size="13" fill="#059669">internal HTTP · X-Service-Token</text>

  <!-- ===================== MONGO ===================== -->
  <g filter="url(#shadow)">
    <rect x="60" y="692" width="620" height="150" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  </g>
  <text x="84" y="724" font-size="13" font-weight="700" letter-spacing="1.5" fill="#0891b2">DATABASE</text>
  <text x="84" y="756" font-size="19" font-weight="700" fill="#0f172a">MongoDB 8</text>
  <text x="84" y="784" font-size="14.5" fill="#475569">Single source of truth</text>
  <text x="84" y="810" font-size="13" fill="#64748b">Users · Tickets · Messages · Events · Articles · Categories · Q&amp;A</text>

  <!-- ===================== AI LAYER ===================== -->
  <g filter="url(#shadow)">
    <rect x="760" y="692" width="660" height="150" rx="14" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
  </g>
  <text x="784" y="724" font-size="13" font-weight="700" letter-spacing="1.5" fill="#ea580c">AI LAYER · ai-layer/  (RAG sidecar)</text>
  <text x="784" y="756" font-size="19" font-weight="700" fill="#0f172a">FastAPI (Python) · /chat</text>
  <g font-size="13.5" font-weight="600">
    <rect x="784" y="774" width="200" height="34" rx="8" fill="#fff7ed" stroke="#fed7aa"/><text x="884" y="796" fill="#9a3412" text-anchor="middle">FAISS retrieval</text>
    <rect x="994" y="774" width="230" height="34" rx="8" fill="#fff7ed" stroke="#fed7aa"/><text x="1109" y="796" fill="#9a3412" text-anchor="middle">sentence-transformers</text>
  </g>
  <text x="784" y="828" font-size="13" fill="#64748b">Ingests PDF / DOCX knowledge sources → embedded index</text>

  <!-- arrow ai -> providers -->
  <line x1="1090" y1="842" x2="1090" y2="900" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1104" y="878" font-size="13" fill="#ea580c">provider routing</text>

  <!-- providers -->
  <g filter="url(#shadow)">
    <rect x="760" y="902" width="660" height="86" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  </g>
  <text x="784" y="932" font-size="13" font-weight="700" letter-spacing="1.5" fill="#94a3b8">LLM PROVIDERS</text>
  <rect x="784" y="942" width="290" height="34" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/><text x="929" y="964" font-size="14" font-weight="600" fill="#5b21b6" text-anchor="middle">Google Gemini (default)</text>
  <rect x="1084" y="942" width="200" height="34" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="1184" y="964" font-size="14" font-weight="600" fill="#334155" text-anchor="middle">OpenAI (fallback)</text>

  <!-- ===================== Ara fallback callout ===================== -->
  <g filter="url(#shadow)">
    <rect x="60" y="862" width="620" height="126" rx="14" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
  </g>
  <text x="84" y="892" font-size="14" font-weight="700" fill="#b45309">Ara answer resolution — graceful fallback</text>
  <text x="84" y="920" font-size="13.5" fill="#78350f">1 · RAG sidecar (/chat)  →  2 · direct Gemini  →</text>
  <text x="84" y="944" font-size="13.5" fill="#78350f">3 · direct OpenAI  →  4 · client-side curated Q&amp;A</text>
  <text x="84" y="972" font-size="12.5" fill="#a16207">Ara always responds, even if the AI layer is down.</text>

  <!-- footer -->
  <text x="60" y="1022" font-size="12.5" fill="#94a3b8">Deployed via Docker Compose: frontend :3000 · server :8001 · ai (internal :8000) · mongo :27017    ·    legacy backend/ is deprecated (kept for reference)</text>
</svg>
