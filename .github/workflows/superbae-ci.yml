name: Superbae CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Express + MongoDB)
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (logic + schema)
        run: npm test
      - name: End-to-end smoke test (real MongoDB)
        run: npm run smoke
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/superbae_ci
          JWT_ACCESS_SECRET: ci-access-secret
          JWT_REFRESH_SECRET: ci-refresh-secret
